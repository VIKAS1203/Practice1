name: Deploy Website to GitHub Pages

on:
  push:
    branches: [ main ] # Triggers the pipeline every time you push code to main

# Permissions needed for GitHub Actions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Website Files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads everything in the root directory (index.html, styles.css)

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
